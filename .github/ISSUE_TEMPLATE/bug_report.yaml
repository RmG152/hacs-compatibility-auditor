name: Bug Report
description: Report a problem with the HACS Compatibility Auditor integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: input
    id: integration_version
    attributes:
      label: Integration Version
      description: What version of the integration are you running?
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      description: What version of Home Assistant are you running?
      placeholder: "2026.5.0"
    validations:
      required: true

  - type: input
    id: hacs_version
    attributes:
      label: HACS Version
      description: What version of HACS do you have installed?
      placeholder: "2.0.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: |
        Please enable debug logging for this integration and paste any relevant logs.
        Add `custom_components.hacs_compatibility_auditor: debug` to your
        `configuration.yaml` logger configuration.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add any other context about the problem here.
