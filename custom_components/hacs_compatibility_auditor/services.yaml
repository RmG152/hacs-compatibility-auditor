check_now:
  name: Forzar comprobación
  description: ⚠️ Fuerza una re-comprobación inmediata de TODOS los paquetes HACS. Esta operación elimina toda la información en caché y re-analiza todas las entidades desde cero. Puede tardar varios minutos y consume cuota de la API de GitHub.

check_package:
  name: Comprobar paquete
  description: Comprueba la compatibilidad de un paquete HACS específico seleccionando su sensor.
  fields:
    entity_id:
      name: Paquete HACS
      description: Selecciona el sensor del paquete que quieres comprobar
      required: true
      selector:
        entity:
          domain: sensor
          integration: hacs_compatibility_auditor

ai_analyze_package:
  name: Analizar con IA
  description: Utiliza un proveedor de IA para analizar si un paquete HACS tiene problemas reales de compatibilidad.
  fields:
    entity_id:
      name: Paquete HACS
      description: Selecciona el sensor del paquete que quieres analizar
      required: true
      selector:
        entity:
          domain: sensor
          integration: hacs_compatibility_auditor
    provider:
      name: Proveedor IA
      description: Proveedor de IA a utilizar (auto = primer proveedor configurado)
      required: false
      default: auto
      selector:
        select:
          options: []

ai_categorize_issue:
  name: Categorizar incidencia con IA
  description: Utiliza IA para categorizar una incidencia específica de GitHub.
  fields:
    repository:
      name: Repositorio
      description: Nombre completo del repositorio (ej. 'owner/repo')
      required: true
      example: "owner/repo"
      selector:
        text:
    issue_number:
      name: Número de incidencia
      description: Número de la incidencia en GitHub
      required: true
      selector:
        number:
          min: 1
    provider:
      name: Proveedor IA
      description: Proveedor de IA a utilizar (opcional, usa el primero configurado)
      required: false
      selector:
        text:

report_to_rules:
  name: Reportar a reglas comunitarias
  description: Genera una URL para crear una incidencia en el repositorio de reglas comunitarias con el análisis de IA. Los campos de la plantilla se rellenan automáticamente al abrir el enlace.
  fields:
    repository:
      name: Repositorio
      description: Nombre completo del repositorio del paquete afectado
      required: true
      example: "owner/repo"
      selector:
        text:
    issue_number:
      name: Número de incidencia
      description: Número de la incidencia en GitHub que se está reportando
      required: true
      selector:
        number:
          min: 1
    category:
      name: Categoría
      description: Categorización realizada por la IA
      required: true
      selector:
        select:
          options:
            - "true_positive"
            - "false_positive"
            - "config_issue"
            - "feature_request"
            - "unrelated"
            - "uncertain"
    reasoning:
      name: Razonamiento
      description: Explicación de la IA sobre la categorización
      required: true
      selector:
        text:
          multiline: true
    action:
      name: Acción
      description: "Tipo de reporte: add_false_positive (usa plantilla false_positive_report) o report_incompatibility (usa plantilla blacklist_request)"
      required: true
      selector:
        select:
          options:
            - "add_false_positive"
            - "report_incompatibility"

ai_analyze_all:
  name: Analizar todo con IA
  description: Ejecuta análisis con IA sobre todos los paquetes que no estén en estado compatible.
  fields:
    provider:
      name: Proveedor IA
      description: Proveedor de IA a utilizar (auto = primer proveedor configurado)
      required: false
      default: auto
      selector:
        select:
          options: []
    use_cached_only:
      name: Usar solo caché
      description: Si se activa, analiza solo con la información en caché sin volver a consultar a GitHub. El resultado podría ser inexacto si la caché está obsoleta.
      required: false
      default: false
      selector:
        boolean:

ai_confirm_report:
  name: Confirmar y reportar con IA
  description: Genera una URL para crear una incidencia en el repositorio de reglas usando el análisis de IA almacenado para un paquete. Los campos de la plantilla se rellenan automáticamente al abrir el enlace.
  fields:
    entity_id:
      name: Paquete HACS
      description: Selecciona el sensor del paquete del que quieres confirmar el reporte
      required: true
      selector:
        entity:
          domain: sensor
          integration: hacs_compatibility_auditor
    issue_number:
      name: Número de incidencia
      description: Número de la incidencia en GitHub (requerido para plantilla false_positive_report)
      required: false
      default: 0
      selector:
        number:
          min: 1
    action:
      name: Acción
      description: "Acción a tomar: add_false_positive o report_incompatibility (opcional, se deriva del veredicto de la IA si se deja vacío)"
      required: false
      default: report_incompatibility
      selector:
        select:
          options:
            - "add_false_positive"
            - "report_incompatibility"
